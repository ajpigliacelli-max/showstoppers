<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THAT SCENE! &mdash; Iconic Movie Moments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--ink:#130821;--ink2:#1E0D36;--ink3:#2A1348;--gold:#FFC72C;--mag:#FF2E88;--teal:#00E5C7;
 --cream:#FFF4E0;--violet:#8B5CF6;--orange:#FF8A3D;
 --disp:'Archivo Black',system-ui,sans-serif;--body:'Outfit',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--cream);font-family:var(--body);min-height:100vh;
 -webkit-font-smoothing:antialiased;
 background-image:radial-gradient(ellipse 120% 60% at 50% -10%,#3B1A5C 0%,transparent 60%)}
body.audience .hostonly{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:16px 20px 70px}
.bulbs{display:flex;gap:10px;justify-content:center;padding:6px 0 12px;flex-wrap:wrap}
.bulb{width:11px;height:11px;border-radius:50%;background:var(--gold);
 box-shadow:0 0 10px var(--gold),0 0 20px rgba(255,199,44,.5);animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
header.hero{text-align:center;padding:2px 0 14px}
h1.logo{font-family:var(--disp);font-size:clamp(2.2rem,8vw,4.6rem);line-height:.92;letter-spacing:-.02em;
 color:var(--gold);text-transform:uppercase;text-shadow:5px 5px 0 var(--mag),10px 10px 0 rgba(0,0,0,.45);
 transform:rotate(-1.6deg)}
.tag{margin-top:15px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;font-size:.76rem;color:var(--teal)}
.bar{display:flex;gap:9px;justify-content:center;margin:2px 0 16px;flex-wrap:wrap}
.bar button{border:0;cursor:pointer;font-family:var(--body);font-weight:900;font-size:.66rem;
 letter-spacing:.14em;text-transform:uppercase;padding:9px 16px;border-radius:30px;background:var(--ink2);color:#6B5B85}
.bar button:hover{color:var(--cream)} .bar button.on{background:var(--teal);color:#0C2E29}
.rail{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.rail button{border:0;cursor:pointer;font-family:var(--body);font-weight:900;text-transform:uppercase;
 letter-spacing:.07em;font-size:.64rem;padding:10px 12px;border-radius:11px;background:var(--ink2);
 color:#9C8BB8;box-shadow:0 4px 0 rgba(0,0,0,.5);line-height:1.25;text-align:center}
.rail button b{display:block;font-size:.58rem;color:#6B5B85;letter-spacing:.1em}
.rail button.on{background:var(--gold);color:#2A1348;box-shadow:0 4px 0 #B8821A}
.rail button.on b{color:#7A5A10}
.stage{background:linear-gradient(165deg,var(--ink3),var(--ink2));border-radius:22px;
 padding:clamp(16px,2.6vw,26px);box-shadow:0 8px 0 rgba(0,0,0,.45);margin-bottom:18px}
.kick{font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:.66rem;color:var(--teal);margin-bottom:7px}
.big{font-family:var(--disp);font-size:clamp(1.5rem,4.4vw,2.6rem);text-transform:uppercase;color:var(--cream);line-height:1.08}
.sub{font-size:.98rem;color:#B9A9D1;margin-top:8px}
.script{margin-top:16px;background:rgba(0,229,199,.07);border-left:5px solid var(--teal);
 border-radius:0 14px 14px 0;padding:15px 18px}
.script .lab{font-weight:900;letter-spacing:.18em;text-transform:uppercase;font-size:.6rem;color:var(--teal);margin-bottom:9px}
.script p{font-size:1.12rem;line-height:1.6;margin-bottom:11px;color:var(--cream)}
.script p:last-child{margin-bottom:0}
.script p:before{content:'\201C'} .script p:after{content:'\201D'}
.cues{margin-top:12px;font-size:.84rem;color:var(--orange);line-height:1.5}
.cues li{margin-left:17px;margin-bottom:4px}
.beat{margin-top:15px;background:var(--ink);border-radius:15px;padding:15px 17px;box-shadow:0 5px 0 rgba(0,0,0,.45)}
.beat h4{font-family:var(--disp);font-size:1.02rem;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
.clip{background:var(--ink);border-radius:16px;padding:14px 16px;margin-bottom:12px;
 box-shadow:0 5px 0 rgba(0,0,0,.45);border-left:6px solid var(--gold)}
.clip.violet{border-left-color:var(--violet)} .clip.mag{border-left-color:var(--mag)}
.clip.teal{border-left-color:var(--teal)} .clip.orange{border-left-color:var(--orange)}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ctitle{font-family:var(--disp);font-size:1.05rem;text-transform:uppercase;color:var(--cream);line-height:1.15}
.cyear{color:var(--gold)} .cmom{font-size:.87rem;color:#B9A9D1;margin-top:3px}
.meta{font-size:.62rem;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:#6B5B85;margin-top:5px}
.btn{border:0;cursor:pointer;font-family:var(--body);font-weight:900;text-transform:uppercase;
 letter-spacing:.06em;font-size:.72rem;padding:12px 18px;border-radius:12px;background:var(--gold);
 color:#2A1348;box-shadow:0 4px 0 #B8821A;white-space:nowrap}
.btn.alt{background:var(--teal);color:#0C2E29;box-shadow:0 4px 0 #009B88}
.btn.ghost{background:var(--ink3);color:#C9B8E0;box-shadow:0 4px 0 rgba(0,0,0,.5)}
.btn:active{transform:translateY(2px)}
.fact{margin-top:11px;background:rgba(255,199,44,.09);border-left:5px solid var(--gold);
 border-radius:0 12px 12px 0;padding:12px 15px;font-size:1.04rem;line-height:1.55}
.fact .lab{font-weight:900;letter-spacing:.16em;text-transform:uppercase;font-size:.58rem;color:var(--gold);margin-bottom:7px}
.note{margin-top:9px;font-size:.81rem;color:var(--orange);line-height:1.45}
.pwrap{margin-top:12px;border-radius:14px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.45);background:#000;display:none}
.pwrap.on{display:block}
.pframe{position:relative;padding-bottom:56.25%;height:0}
.pframe iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.q{text-align:center;padding:14px 0 6px}
.qline{font-family:var(--disp);font-size:clamp(1.6rem,5.2vw,3.1rem);color:var(--cream);line-height:1.15;margin:16px 0}
.qans{font-family:var(--disp);font-size:clamp(1.7rem,5.6vw,3.3rem);color:var(--gold);line-height:1.15;margin:16px 0;display:none}
.qans.on{display:block}
.role{margin-top:11px;background:var(--ink);border-radius:13px;padding:12px 15px;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.role b{font-family:var(--disp);font-size:.95rem;text-transform:uppercase;color:var(--mag);display:block;margin-bottom:3px}
.role span{font-size:.86rem;color:#B9A9D1}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:6px}
.team{background:var(--ink);border-radius:16px;padding:15px 11px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.45)}
.team .nm{font-family:var(--disp);font-size:.95rem;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.team .nu{font-family:var(--disp);font-size:2.9rem;line-height:1;color:var(--gold)}
.team .rw{display:flex;gap:6px;justify-content:center;margin-top:10px}
.team .rw button{border:0;cursor:pointer;font-family:var(--disp);font-size:1rem;width:46px;height:40px;
 border-radius:10px;background:var(--ink3);color:var(--cream);box-shadow:0 4px 0 rgba(0,0,0,.5)}
.team .rw button.p{background:var(--mag);color:#fff;box-shadow:0 4px 0 #A3134F}
.nav{display:flex;gap:9px;justify-content:space-between;margin-top:4px}
.foot{text-align:center;margin-top:22px;font-size:.7rem;color:#6B5B85;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.lib{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:11px}
</style>
</head>

<script>
const D={"seg": [{"type": "open", "name": "WELCOME", "mins": 2, "say": ["Last week we did the musicals. Today we're doing the moments — the scenes you can still see in your head right now, forty, fifty, sixty years later.", "But we're not just watching. In between, I'm going to tell you how some of these were actually made, because the stories behind them are better than you think.", "There are two games in here too. And at some point a few of you are getting handed a script and a hat."], "cues": ["Point at the tables when you say “your table is your team.”", "Do not explain the scoring. Nobody cares and it eats a minute.", "Be in Reel One by 2:00."], "at": "0:00"}, {"type": "reel", "n": 1, "name": "THE GASP", "blurb": "The moment the whole theater went quiet.", "color": "violet", "intro": "Four of these stopped a room cold. Some of you saw them in a theater the week they opened.", "clips": [{"k": "oz", "t": "The Wizard of Oz", "y": 1939, "m": "Dorothy opens the door — into color", "v": "YvQ7HiJkUJ4", "ch": "Warner Bros. Entertainment", "s": 0, "e": 126, "run": 126, "note": "Warmest opener you have. Ask who saw it in a theater before you roll.", "fact": "Oz cost about $2.8 million in 1939 — a fortune. The Technicolor camera needed so much light the sets were punishing to stand on, and the picture was only possible at that scale because Technicolor had just released a faster film stock."}, {"k": "psycho", "t": "Psycho", "y": 1960, "m": "The shower — what 1960 was not ready for", "v": "BYnPGS9Ev8w", "ch": "Universal Pictures", "s": 0, "e": 95, "run": 95, "note": "SAY THE HEADS-UP LINE FIRST. Skip entirely if today's group is fragile.", "fact": "Seven days of shooting for about forty-five seconds of film: 78 camera set-ups and 52 cuts. The blood is chocolate syrup — Hitchcock shot in black and white partly because real blood would have been too much. The stabbing sound is a knife going into a melon."}, {"k": "apes", "t": "Planet of the Apes", "y": 1968, "m": "The beach — the ending", "v": "mDLS12_a-fk", "ch": "Movieclips", "s": 55, "e": 160, "run": 105, "note": "Let the reveal land. Do not talk over it. No fact needed here — ask the question instead.", "fact": "ASK, don't tell: “How many of you saw this one cold, with no idea what was coming?”"}], "mins": 6.6, "at": "2:00"}, {"type": "story", "name": "BEFORE THE COMPUTERS", "mins": 3, "kicker": "How they actually did it", "stand": "Everything you just watched was done with light, paint, cardboard and patience.", "beats": [{"h": "The color cost a fortune", "say": "That doorway you just watched was one of the most expensive shots in Hollywood. Oz cost about two point eight million dollars in 1939. The Technicolor camera was enormous and it drank light — the sets were so hot under those lamps that people genuinely suffered on them. The only reason the picture could be made at that size is that Technicolor had just put out a faster film stock. The movie arrived at exactly the moment the technology could carry it."}, {"h": "Forty-five seconds, seven days", "say": "The shower scene runs about forty-five seconds. It took seven days to shoot. Seventy-eight separate camera set-ups and fifty-two cuts — for forty-five seconds. The knife never touches anybody. The blood is chocolate syrup, and Hitchcock shot the whole film in black and white partly because real blood on screen would have been too much to take. The sound of the stabbing is a knife going into a melon. He auditioned melons for it."}, {"h": "The shark that would not work", "say": "And then Jaws. Three mechanical sharks, and they broke constantly — saltwater and machinery do not get along. So Spielberg shot around it: the music, the barrels, the point of view from underneath. In a two-hour movie the shark is on screen about four minutes. Three percent. The thing everybody remembers is the thing that barely appears, and it is scarier because the equipment failed."}], "close": "Every one of those was a problem solved with no computer anywhere in the building.", "at": "8:36"}, {"type": "finish", "name": "FINISH THE LINE", "mins": 5, "tagline": "I start it. You finish it. Out loud.", "how": ["The line comes up with the end missing.", "Shout the ending — together is fine.", "I click. We find out."], "items": [{"film": "Gone with the Wind", "y": 1939, "setup": "Frankly, my dear,", "answer": "…I don’t give a damn.", "fact": "AFI’s number one movie line of all time."}, {"film": "The Wizard of Oz", "y": 1939, "setup": "Toto, I’ve a feeling we’re", "answer": "…not in Kansas anymore.", "fact": "AFI’s number four."}, {"film": "Jaws", "y": 1975, "setup": "You’re gonna need", "answer": "…a bigger boat.", "fact": "AFI’s number thirty-five — and it was improvised on the boat."}, {"film": "Sunset Boulevard", "y": 1950, "setup": "All right, Mr. DeMille, I’m ready for my", "answer": "…close-up.", "fact": "AFI’s number seven."}], "spares": [{"film": "Love Story", "y": 1970, "setup": "Love means never having to", "answer": "…say you’re sorry.", "fact": "AFI’s number thirteen."}, {"film": "Field of Dreams", "y": 1989, "setup": "If you build it,", "answer": "…he will come.", "fact": "AFI’s number thirty-nine."}], "note": "Four lines in five minutes. The talking between them IS the program — don't rush to finish.", "at": "11:36"}, {"type": "story", "name": "WHAT THEY WERE ALLOWED TO SHOW", "mins": 3, "kicker": "The rules nobody told the audience", "stand": "For thirty-four years, American movies were made under a written rulebook.", "beats": [{"h": "The Code", "say": "From 1934 to 1968 — thirty-four years — every major American studio made films under the Production Code. People called it the Hays Code. It was written in 1930, but nobody really enforced it until '34. It was not a government law. The studios wrote it themselves, to keep the government from writing one for them."}, {"h": "Twin beds, twenty-seven inches apart", "say": "Some of the rules sound made up and they are not. A married couple could not be shown in one bed. Twin beds — and they had to be at least twenty-seven inches apart. During a kiss, at least one foot had to stay on the floor. And there was a three-second limit on the kiss itself."}, {"h": "You can watch it happen", "say": "You can see it land in real time. In The Thin Man, 1934, Nick and Nora share a bed. Two years later, in After the Thin Man, the same married couple are in twin beds. Nothing changed about them. The rule changed. And when television got going, it adopted its own version of the same code — which is exactly why Lucy and Ricky had two beds."}], "close": "The Code ended in 1968 and was replaced by the ratings system we still use. So when you watch something from the fifties and think they were being coy — they were not being coy. They were being audited.", "at": "16:36"}, {"type": "reel", "n": 2, "name": "THE SWOON", "blurb": "Romance, under the rules of the day.", "color": "mag", "intro": "Now watch what they did with the rules we just talked about.", "clips": [{"k": "itch", "t": "The Seven Year Itch", "y": 1955, "m": "Marilyn over the subway grate", "v": "fIh6HDeXKGY", "ch": "Movieclips", "s": 0, "e": 110, "run": 110, "note": "Pure recognition — they react before it starts.", "fact": "This is the image that got around the Code: no kiss, no bedroom, nothing the censors could point at. Just a skirt and a subway grate — and it became one of the most reproduced pictures of the century."}, {"k": "harry", "t": "When Harry Met Sally…", "y": 1989, "m": "New Year's Eve — the finale", "v": "ovkiChacfc8", "ch": "Movieclips", "s": 0, "e": 160, "run": 160, "note": "DEFAULT = this finale. The deli scene is funnier and they know it — decide before you walk in.", "fact": "Nineteen eighty-nine: the Code is twenty-one years dead. Notice how much longer the camera is allowed to hold on two people than anything you just watched from the fifties."}], "mins": 5.3, "at": "19:36"}, {"type": "scramble", "name": "THE SCENE SCRAMBLE", "mins": 7, "tagline": "You get a script. You get a hat. The room guesses the movie.", "how": ["Three volunteers per scene. Hand out the cards and the props.", "Nobody memorises anything — the cards are big, just read.", "At the end, the rest of the room shouts the movie it’s spoofing."], "scenes": [{"id": "A", "title": "THE SPECIAL ORDER", "answer": "When Harry Met Sally… (1989)", "setting": "A diner booth. A waitress with an order pad and no patience left.", "props": ["Order pad + pencil", "Apron", "Two coffee mugs", "A laminated menu"], "cast": [["WAITRESS", "Holds the pad. Gets wearier with every line."], ["THE PARTICULAR ONE", "Orders with enormous confidence."], ["THE OTHER CUSTOMER", "Says almost nothing. Watches. Gets the last line."]], "lines": [["WAITRESS", "What can I get you?"], ["THE PARTICULAR ONE", "I’ll have the pie."], ["WAITRESS", "Pie. Fine."], ["THE PARTICULAR ONE", "But heated. And the ice cream on the side. Not on top. Beside."], ["WAITRESS", "…Beside."], ["THE PARTICULAR ONE", "And if it’s the strawberry I’d rather have whipped cream, but only if it’s real. Is it real?"], ["WAITRESS", "(flat) It’s something."], ["THE PARTICULAR ONE", "Then no ice cream. But still heated. And a fork, not a spoon. (beat) Perfect. (beams) That’s all."], ["WAITRESS", "(turning to the other customer, defeated) And for you?"], ["THE OTHER CUSTOMER", "(level, deadpan, to the waitress — the big line)", "I’ll have what she’s having."]], "cue": "Hold for the laugh. Then: “What movie are we in?”"}, {"id": "B", "title": "THE SMALL BOAT", "answer": "Jaws (1975)", "setting": "Three people on a boat that is too small. Something is in the water.", "props": ["Sea captain hat", "Toy shark on a stick", "Fishing rod", "Pair of binoculars"], "cast": [["THE CAPTAIN", "Sea captain hat. Fears nothing. Wrong about that."], ["THE SCIENTIST", "Binoculars. Explains things nobody asked about."], ["THE CHIEF", "Nervous. Does not want to be on this boat. Gets the last line."]], "lines": [["THE CAPTAIN", "She’s a fi const S=D.seg; let cur=0, aud=false, SC=[0,0,0,0];
const el=id=>document.getElementById(id);
for(let i=0;i<16;i++){const d=document.createElement('div');d.className='bulb';d.style.animationDelay=(i*.11)+'s';el('b1').appendChild(d);}
function tog(){aud=!aud;document.body.classList.toggle('audience',aud);
 const b=el('aud');b.textContent='Audience Mode: '+(aud?'On':'Off');b.classList.toggle('on',aud);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function rail(){el('rail').innerHTML=S.map((s,i)=>
 '<button class="'+(i===cur?'on':'')+'" onclick="go('+i+')">'+esc(s.name)+'<b>'+s.at+'</b></button>').join('');}
function go(i){cur=Math.max(0,Math.min(S.length-1,i));rail();draw();window.scrollTo({top:0,behavior:'smooth'});}
function step(n){go(cur+n);}
function show(w){el('rail').querySelectorAll('button').forEach(b=>b.classList.remove('on'));
 el('panel').innerHTML = w==='lib'?libHTML():scoreHTML();window.scrollTo({top:0,behavior:'smooth'});}
function sayHTML(arr,cues){let h='<div class="script hostonly"><div class="lab">Say this &mdash; your words are fine</div>';
 h+=arr.map(p=>'<p>'+esc(p)+'</p>').join('');h+='</div>';
 if(cues&&cues.length)h+='<ul class="cues hostonly">'+cues.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul>';
 return h;}
function clipHTML(c,col){
 return '<div class="clip '+col+'"><div class="ctop"><div><div class="ctitle">'+esc(c.t)+
 ' <span class="cyear">'+c.y+'</span></div><div class="cmom">'+esc(c.m)+'</div>'+
 '<div class="meta">'+esc(c.ch)+' &bull; plays '+Math.floor(c.run/60)+':'+String(c.run%60).padStart(2,'0')+'</div></div>'+
 '<button class="btn alt" onclick="play(\''+c.k+'\',\''+c.v+'\','+c.s+','+c.e+')">Play</button></div>'+
 (c.fact?'<div class="fact hostonly"><div class="lab">Before you roll, say this</div>'+esc(c.fact)+'</div>':'')+
 (c.note?'<div class="note hostonly">'+esc(c.note)+'</div>':'')+
 '<div class="pwrap" id="p_'+c.k+'"><div class="pframe" id="f_'+c.k+'"></div></div></div>';}
function play(k,v,s,e){
 document.querySelectorAll('.pwrap').forEach(p=>{if(p.id!=='p_'+k){p.classList.remove('on');
  const f=p.querySelector('.pframe'); if(f) f.innerHTML='';}});
 const w=el('p_'+k), f=el('f_'+k);
 f.innerHTML='<iframe src="https://www.youtube.com/embed/'+v+'?autoplay=1&rel=0&modestbranding=1&start='+s+'&end='+e+'" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
 w.classList.add('on'); w.scrollIntoView({behavior:'smooth',block:'center'});}
function draw(){const s=S[cur]; let h='';
 if(s.type==='open'||s.type==='close'){
  h='<div class="stage"><div class="kick">'+s.at+' &bull; '+s.mins+' min</div><div class="big">'+esc(s.name)+'</div>'+sayHTML(s.say,s.cues)+'</div>';}
 else if(s.type==='reel'){
  h='<div class="stage"><div class="kick">'+s.at+' &bull; Reel '+s.n+' of 4 &bull; '+s.mins+' min</div>'+
    '<div class="big">'+esc(s.name)+'</div><div class="sub">'+esc(s.blurb)+'</div>'+
    sayHTML([s.intro])+'</div><div class="stage">'+s.clips.map(c=>clipHTML(c,s.color)).join('')+'</div>';}
 else if(s.type==='story'){
  h='<div class="stage"><div class="kick">'+s.at+' &bull; Story &bull; '+s.mins+' min &bull; '+esc(s.kicker)+'</div>'+
    '<div class="big">'+esc(s.name)+'</div><div class="sub">'+esc(s.stand)+'</div>'+
    s.beats.map(b=>'<div class="beat hostonly"><h4>'+esc(b.h)+'</h4><div class="script" style="margin:0;background:none;border:0;padding:0"><p>'+esc(b.say)+'</p></div></div>').join('')+
    '<div class="fact hostonly" style="margin-top:15px"><div class="lab">Land it on this</div>'+esc(s.close)+'</div></div>';}
 else if(s.type==='finish'){
  h='<div class="stage"><div class="kick">'+s.at+' &bull; Game 1 &bull; '+s.mins+' min</div><div class="big">'+esc(s.name)+'</div>'+
    '<div class="sub">'+esc(s.tagline)+'</div><ul class="cues">'+s.how.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+

  s.items.forEach((it,i)=>{h+='<div class="stage q"><div class="kick">'+(i+1)+' of '+s.items.length+' &bull; '+esc(it.film)+' ('+it.y+')</div>'+

   '<div class="qans" id="a'+i+'">'+esc(it.answer)+'</div>'+
   '<button class="btn" onclick="rev('+i+')">Reveal</button>'+
   '<div class="fact hostonly" style="text-align:left;margin-top:13px"><div class="lab">Then tell them</div>'+esc(it.fact)+'</div></div>';});
  h+='<div class="stage hostonly"><div class="kick">Spares if you have time</div>'+
     s.spares.map(x=>'<div class="note" style="color:#B9A9D1">&ldquo;'+esc(x.setup)+'&hellip;&rdquo; &mdash; '+esc(x.answer)+' ('+esc(x.film)+')</div>').join('')+'</div>';}
 else if(s.type==='scramble'){
  h='<div class="stage"><div class="kick">'+s.at+' &bull; Game 2 &bull; '+s.mins+' min</div><div class="big">'+esc(s.name)+'</div>'+
    '<div class="sub">'+esc(s.tagline)+'</div><ul class="cues">'+s.how.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
    '<div class="note hostonly">'+esc(s.note)+'</div></div>';
  s.scenes.forEach(sc=>{h+='<div class="stage"><div class="kick">Scene '+sc.id+'</div><div class="big">'+esc(sc.title)+'</div>'+
   '<div class="sub">'+esc(sc.setting)+'</div>'+
   sc.cast.map(c=>'<div class="role"><b>'+esc(c[0])+'</b><span>'+esc(c[1])+'</span></div>').join('')+
   '<div class="note hostonly">Props: '+sc.props.map(esc).join(', ')+'</div>'+
   '<div class="qans" id="s'+sc.id+'">'+esc(sc.answer)+'</div>'+
   '<div style="text-align:center;margin-top:13px"><button class="btn" onclick="revs(\''+sc.id+'\')">Reveal the movie</button></div>'+
   '<div class="note hostonly">'+esc(sc.cue)+'</div></div>';});}
 el('panel').innerHTML=h;}
function rev(i){el('a'+i).classList.add('on');}
function revs(i){el('s'+i).classList.add('on');}
function libHTML(){return '<div class="stage"><div class="kick">Verified spare clips</div><div class="big">Swap-ins</div>'+
 '<div class="sub">Every one checked live &mdash; it resolves and its owner allows embedding.</div></div>'+
 '<div class="stage"><div class="lib">'+D.spares.map(c=>clipHTML(c,'teal')).join('')+'</div></div>'+
 '<div class="stage hostonly"><div class="kick">Spare facts for dead air</div>'+
 D.facts.map(f=>'<div class="note" style="color:#B9A9D1">'+esc(f[0])+'</div>').join('')+'</div>';}
function scoreHTML(){return '<div class="stage"><div class="kick">Scoreboard</div><div class="big">How We Stand</div>'+
 '<div class="scores">'+SC.map((v,i)=>'<div class="team"><div class="nm">Table '+(i+1)+'</div><div class="nu">'+v+'</div>'+
 '<div class="rw"><button onclick="sc('+i+',-1)">&minus;</button><button class="p" onclick="sc('+i+',1)">+</button></div></div>').join('')+
 '</div><div style="text-align:center;margin-top:16px"><button class="btn ghost" onclick="SC=[0,0,0,0];show(\'score\')">Clear</button></div></div>';}
function sc(i,n){SC[i]=Math.max(0,SC[i]+n);show('score');}
rail();draw();
