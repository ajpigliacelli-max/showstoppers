<!DOCTYPE html><html><head><meta charset="utf-8"><title>clip test</title></head><body style="background:#111;color:#eee;font-family:sans-serif">
<pre id="out">testing…</pre><div id="box"></div>
<script>
var IDS=(location.hash.slice(1)||'').split(',').filter(Boolean),R={},i=0;
function log(){document.getElementById('out').textContent=JSON.stringify(R,null,1);document.title='done '+Object.keys(R).length+'/'+IDS.length;}
function next(){if(i>=IDS.length){document.title='ALLDONE';log();return;}
 var id=IDS[i++],d=document.createElement('div');d.id='p_'+id;document.getElementById('box').innerHTML='';document.getElementById('box').appendChild(d);
 var done=false,P=new YT.Player('p_'+id,{width:480,height:270,videoId:id,playerVars:{autoplay:1,mute:1},
  events:{onReady:function(e){e.target.mute();e.target.playVideo();},
   onStateChange:function(e){if(e.data===1&&!done){done=true;setTimeout(function(){var vd=P.getVideoData();R[id]={ok:true,dur:Math.round(P.getDuration()),t:+P.getCurrentTime().toFixed(1),title:vd.title,author:vd.author};log();P.destroy();next();},4000);}},
   onError:function(e){if(!done){done=true;R[id]={ok:false,err:e.data};log();try{P.destroy()}catch(x){};next();}}}});
 setTimeout(function(){if(!done){done=true;R[id]={ok:false,err:'timeout state '+(P.getPlayerState?P.getPlayerState():'?')};log();try{P.destroy()}catch(x){};next();}},15000);}
function onYouTubeIframeAPIReady(){next();}
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
