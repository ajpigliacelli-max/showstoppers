<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHOWSTOPPERS! — Musical Movies Game Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#130821; --ink2:#1E0D36; --ink3:#2A1348;
  --gold:#FFC72C; --mag:#FF2E88; --teal:#00E5C7; --cream:#FFF4E0;
  --violet:#8B5CF6; --orange:#FF8A3D;
  --disp:'Archivo Black',system-ui,sans-serif;
  --body:'Outfit',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--ink); color:var(--cream); font-family:var(--body);
  min-height:100vh; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 120% 60% at 50% -10%, #3B1A5C 0%, transparent 60%);
}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 70px}

/* ---------- MARQUEE HEADER ---------- */
.bulbs{display:flex;gap:10px;justify-content:center;padding:6px 0 14px;flex-wrap:wrap}
.bulb{width:11px;height:11px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 10px var(--gold),0 0 20px rgba(255,199,44,.5);animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
header.hero{text-align:center;padding:4px 0 22px}
h1.logo{
  font-family:var(--disp); font-size:clamp(2.6rem,9vw,5.4rem); line-height:.92;
  letter-spacing:-.02em; color:var(--gold); text-transform:uppercase;
  text-shadow:5px 5px 0 var(--mag), 10px 10px 0 rgba(0,0,0,.45);
  transform:rotate(-1.6deg);
}
.tag{margin-top:16px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  font-size:.78rem;color:var(--teal)}

/* ---------- TABS ---------- */
nav.tabs{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:22px 0 26px}
.tab{
  font-family:var(--body);font-weight:900;font-size:.84rem;letter-spacing:.04em;
  text-transform:uppercase;padding:13px 19px;border:0;cursor:pointer;
  background:var(--ink3);color:var(--cream);border-radius:13px;
  box-shadow:0 4px 0 rgba(0,0,0,.5); transition:transform .11s, box-shadow .11s;
}
.tab:hover{transform:translateY(-2px) rotate(-1deg);box-shadow:0 6px 0 rgba(0,0,0,.5)}
.tab:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.tab.on{background:var(--mag);color:#fff;box-shadow:0 4px 0 #A3134F;transform:rotate(-1.4deg) scale(1.04)}
.tab.on.g1{background:var(--gold);color:#2A1348;box-shadow:0 4px 0 #B8821A}
.tab.on.g2{background:var(--teal);color:#0C2E29;box-shadow:0 4px 0 #009B88}
.tab.on.g3{background:var(--violet);color:#fff;box-shadow:0 4px 0 #5B2EB8}
.tab.on.g4{background:var(--orange);color:#3A1703;box-shadow:0 4px 0 #B85A1A}

/* ---------- PANELS ---------- */
.panel{display:none;animation:pop .22s ease}
.panel.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{
  background:var(--ink2);border-radius:20px;padding:26px;
  box-shadow:0 7px 0 rgba(0,0,0,.45);margin-bottom:18px;
}
.card.tiltL{transform:rotate(-.7deg)} .card.tiltR{transform:rotate(.7deg)}
h2.ttl{font-family:var(--disp);font-size:clamp(1.5rem,4.4vw,2.5rem);text-transform:uppercase;
  color:var(--gold);line-height:1;letter-spacing:-.01em}
h3.sub{font-weight:900;text-transform:uppercase;letter-spacing:.14em;font-size:.76rem;
  color:var(--teal);margin-bottom:12px}
p.lede{font-size:1.03rem;line-height:1.6;color:#E8DCC8;max-width:62ch}
.rule{height:4px;background:repeating-linear-gradient(90deg,var(--gold) 0 14px,transparent 14px 26px);
  margin:16px 0;border-radius:2px;opacity:.75}

/* ---------- LOBBY GRID ---------- */
.gamegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(246px,1fr));gap:15px;margin-top:6px}
.gcard{border:0;cursor:pointer;text-align:left;border-radius:18px;padding:21px;
  color:#1A0B2E;font-family:var(--body);box-shadow:0 6px 0 rgba(0,0,0,.45);
  transition:transform .12s, box-shadow .12s}
.gcard:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:0 10px 0 rgba(0,0,0,.45)}
.gcard h4{font-family:var(--disp);font-size:1.22rem;text-transform:uppercase;line-height:1;margin-bottom:9px}
.gcard p{font-size:.88rem;font-weight:600;line-height:1.42;opacity:.82}
.gcard .mins{display:inline-block;margin-top:12px;font-weight:900;font-size:.68rem;
  letter-spacing:.16em;text-transform:uppercase;background:rgba(0,0,0,.22);
  padding:5px 10px;border-radius:20px}
.c1{background:var(--gold)} .c2{background:var(--teal)} .c3{background:var(--mag);color:#fff}
.c4{background:var(--violet);color:#fff} .c5{background:var(--orange)}

/* ---------- SCOREBOARD ---------- */
.board{background:var(--ink3);border-radius:18px;padding:19px;box-shadow:0 6px 0 rgba(0,0,0,.45)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-top:12px}
.team{background:var(--ink2);border-radius:14px;padding:13px;text-align:center}
.team input{width:100%;background:transparent;border:0;border-bottom:2px dashed rgba(255,244,224,.28);
  color:var(--cream);font-family:var(--body);font-weight:900;font-size:.92rem;text-align:center;
  padding:4px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.team input:focus{outline:0;border-bottom-color:var(--gold)}
.score{font-family:var(--disp);font-size:2.5rem;color:var(--gold);line-height:1.1;margin:7px 0}
.pts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pts button{border:0;cursor:pointer;font-family:var(--body);font-weight:900;font-size:.76rem;
  padding:7px 10px;border-radius:9px;background:var(--ink);color:var(--cream);
  box-shadow:0 3px 0 rgba(0,0,0,.5)}
.pts button:hover{background:var(--mag);color:#fff}
.pts button.minus:hover{background:#555}

/* ---------- PLAY SURFACE ---------- */
.stage{background:linear-gradient(165deg,var(--ink3),var(--ink2));border-radius:22px;
  padding:clamp(22px,4vw,42px);box-shadow:0 8px 0 rgba(0,0,0,.45);text-align:center;
  min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.qmeta{font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:.7rem;
  color:var(--teal);margin-bottom:16px}
.qbig{font-family:var(--disp);font-size:clamp(1.6rem,5.2vw,3.1rem);line-height:1.08;
  text-transform:uppercase;color:var(--cream);max-width:24ch;margin:0 auto}
.qbig .blank{color:var(--gold);letter-spacing:.06em}
.qsmall{margin-top:16px;font-size:1.02rem;font-weight:600;color:#D9C9AE;max-width:46ch}
.answer{display:none;margin-top:24px;padding:20px;background:rgba(0,229,199,.1);
  border-radius:16px;border:2px dashed rgba(0,229,199,.45);max-width:50ch;width:100%}
.answer.show{display:block;animation:pop .22s ease}
.answer .big{font-family:var(--disp);font-size:clamp(1.25rem,3.6vw,2rem);color:var(--teal);
  text-transform:uppercase;line-height:1.1}
.answer .det{margin-top:9px;font-weight:600;font-size:.95rem;color:#CFE8E3}
.controls{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{border:0;cursor:pointer;font-family:var(--body);font-weight:900;text-transform:uppercase;
  letter-spacing:.05em;font-size:.86rem;padding:15px 25px;border-radius:14px;
  background:var(--gold);color:#2A1348;box-shadow:0 5px 0 #B8821A;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #B8821A}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #B8821A}
.btn.alt{background:var(--teal);color:#0C2E29;box-shadow:0 5px 0 #009B88}
.btn.alt:hover{box-shadow:0 7px 0 #009B88}
.btn.ghost{background:var(--ink);color:var(--cream);box-shadow:0 5px 0 rgba(0,0,0,.55)}
.btn.ghost:hover{box-shadow:0 7px 0 rgba(0,0,0,.55)}
.btn.play{background:var(--mag);color:#fff;box-shadow:0 5px 0 #A3134F}
.btn.play:hover{box-shadow:0 7px 0 #A3134F}
.progress{margin-top:16px;font-weight:700;font-size:.82rem;color:#A694BE;letter-spacing:.05em}

/* ---------- LIBRARY ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}
.chip{border:0;cursor:pointer;font-family:var(--body);font-weight:900;font-size:.74rem;
  text-transform:uppercase;letter-spacing:.08em;padding:9px 14px;border-radius:30px;
  background:var(--ink3);color:var(--cream)}
.chip.on{background:var(--teal);color:#0C2E29}
.chip:hover{background:var(--violet);color:#fff}
#search{flex:1;min-width:190px;background:var(--ink3);border:0;border-radius:30px;
  padding:10px 17px;color:var(--cream);font-family:var(--body);font-weight:600;font-size:.9rem}
#search:focus{outline:2px solid var(--teal)}
.cliplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(282px,1fr));gap:13px}
.clip{background:var(--ink2);border-radius:15px;padding:16px;border-left:5px solid var(--gold);
  transition:transform .11s}
.clip:hover{transform:translateY(-3px)}
.clip .song{font-weight:900;font-size:1.03rem;line-height:1.22;color:var(--cream)}
.clip .mv{font-size:.87rem;font-weight:600;color:var(--gold);margin-top:5px}
.clip .pf{font-size:.8rem;color:#AE9FC4;margin-top:4px;line-height:1.35}
.clip a{display:inline-block;margin-top:11px;background:var(--mag);color:#fff;
  text-decoration:none;font-weight:900;font-size:.72rem;letter-spacing:.09em;
  text-transform:uppercase;padding:9px 14px;border-radius:9px;box-shadow:0 3px 0 #A3134F}
.clip a:hover{transform:translateY(-1px)}
.clip .src{display:block;margin-top:8px;font-size:.67rem;color:#7A6B93;letter-spacing:.04em}
.dec{display:inline-block;font-weight:900;font-size:.64rem;letter-spacing:.1em;
  background:var(--ink3);color:var(--teal);padding:4px 9px;border-radius:20px;margin-bottom:9px}

/* ---------- HOST BOOTH ---------- */
.booth h4{font-family:var(--disp);text-transform:uppercase;color:var(--gold);
  font-size:1.1rem;margin:22px 0 9px}
.booth ol,.booth ul{margin:0 0 6px 20px}
.booth li{line-height:1.62;margin-bottom:8px;color:#E8DCC8}
.booth strong{color:var(--teal)}
.runsheet{width:100%;border-collapse:collapse;margin-top:12px;font-size:.92rem}
.runsheet th{text-align:left;font-weight:900;text-transform:uppercase;font-size:.7rem;
  letter-spacing:.11em;color:var(--teal);padding:9px;border-bottom:2px solid var(--ink3)}
.runsheet td{padding:10px 9px;border-bottom:1px solid var(--ink3);color:#E8DCC8;line-height:1.45}
.runsheet td:first-child{font-weight:900;color:var(--gold);white-space:nowrap}
.fact{background:var(--ink3);border-radius:14px;padding:17px;border-left:5px solid var(--teal);
  margin-bottom:11px;line-height:1.55;font-size:.95rem;color:#E8DCC8}
.note{background:rgba(255,46,136,.11);border:2px dashed rgba(255,46,136,.4);border-radius:14px;
  padding:16px;margin-top:14px;font-size:.92rem;line-height:1.55}
@media print{
  body{background:#fff;color:#000}
  nav.tabs,.bulbs,.controls,.filters,.gamegrid,.board{display:none!important}
  .panel{display:block!important}
  .card,.stage{box-shadow:none;background:#fff;border:1px solid #999;transform:none!important}
  h1.logo{color:#000;text-shadow:none}h2.ttl,.booth h4{color:#000}
  .fact{background:#f4f4f4;color:#000}.booth li,p.lede,.runsheet td{color:#000}
}
@media (max-width:640px){.wrap{padding:12px 13px 50px}.card{padding:19px}}

/* ---------- EMBEDDED PLAYER ---------- */
.pstage{max-width:660px;margin:20px auto 0;width:100%}
.pmarquee{display:flex;gap:9px;justify-content:center;align-items:center;padding:8px 0 9px;
  background:var(--ink);border-radius:14px 14px 0 0;border-bottom:3px solid var(--gold)}
.pmarquee i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:block;
  box-shadow:0 0 7px var(--gold);animation:blink 1.5s infinite}
.pwrap{position:relative;width:100%;border-radius:0 0 16px 16px;overflow:hidden;
  box-shadow:0 6px 0 rgba(0,0,0,.45);background:#000}
.pframe{position:relative;padding-bottom:56.25%;height:0;cursor:pointer}
.pwrap.noclick .pframe{pointer-events:none;cursor:default}
.pframe iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.pcurtain{position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(160deg,var(--ink3),#0B0416);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;
  transition:opacity .35s ease, visibility .35s ease;
  /* clicks pass through to the player underneath: a real click inside the
     YouTube frame is the only thing browsers accept as permission for sound */
  pointer-events:none}
.pcurtain.up{opacity:0;visibility:hidden}
.eq{display:flex;gap:7px;align-items:flex-end;height:62px}
.eq i{display:block;width:9px;height:16px;background:var(--gold);border-radius:3px;
  animation:eqb 1.05s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.11s;background:var(--mag)}
.eq i:nth-child(3){animation-delay:.22s;background:var(--teal)}
.eq i:nth-child(4){animation-delay:.33s;background:var(--gold)}
.eq i:nth-child(5){animation-delay:.44s;background:var(--mag)}
.eq i:nth-child(6){animation-delay:.55s;background:var(--teal)}
.eq i:nth-child(7){animation-delay:.66s;background:var(--gold)}
@keyframes eqb{0%,100%{height:15px}50%{height:60px}}
.plabel{font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:.7rem;color:var(--teal);text-align:center;padding:0 16px}
.phint{font-weight:700;font-size:.74rem;color:#9C8BB8;text-align:center;padding:0 16px;letter-spacing:.03em}
.linkbox{background:linear-gradient(160deg,var(--ink3),#0B0416);border-radius:0 0 16px 16px;
  padding:30px 20px 26px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.45)}
.pstatus{text-align:center;margin-top:9px;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:#7A6B93}
.pstatus.bad{color:var(--gold)}
.pstatus.good{color:var(--teal)}
.pctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.pctl .btn{padding:11px 15px;font-size:.76rem}
.pfallback{display:block;text-align:center;margin-top:11px;font-size:.7rem;color:#7A6B93;
  letter-spacing:.05em;text-decoration:none}
.pfallback:hover{color:var(--teal)}
/* library lightbox */
.lightbox{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(8,3,16,.93);z-index:900;
  display:flex;align-items:center;justify-content:center;padding:22px}
.lbinner{max-width:760px;width:100%}
.lbtitle{font-family:var(--disp);text-transform:uppercase;color:var(--gold);font-size:1.3rem;
  text-align:center;margin-bottom:4px;line-height:1.1}
.lbsub{text-align:center;color:#AE9FC4;font-size:.86rem;font-weight:600;margin-bottom:14px}
@media print{.pstage,.pctl,.pfallback,.lightbox{display:none!important}}
</style>
</head>

<script>
/* =================== EMBEDDED PLAYER =================== */
/* Clips play inside the module. Two things make this work in a sandboxed page:
   1. The curtain is click-through, so pressing it is a REAL click inside the
      YouTube frame. Browsers only allow sound when the gesture happens in the
      frame that owns the media - a click on our own button doesn't count.
   2. If the IFrame API can't load at all (CSP, network), we fall back to a
      plain iframe rather than failing silently. */
let YTREADY=false, apiFailed=false; const ytQueue=[];
/* Opened as a local file there is no web origin, which the IFrame API
   requires - so skip it and go straight to a plain embed, which works. */
const IS_FILE = location.protocol==='file:';
/* Some hosts (the Claude artifact sandbox among them) block every outside
   media source - iframes AND audio. Rather than showing the room a dead
   player, probe once and fall back to a clean "open the clip" link.
   MEDIA_OK: null = still checking, true = media plays here, false = blocked. */
let MEDIA_OK=null;
(function(){
  /* A local file can't fetch cross-origin audio, which says nothing about
     whether an embedded player works there - so don't probe, just allow it. */
  if(IS_FILE){ MEDIA_OK=true; return; }
  /* The user can also force the player on if this guess is wrong. */
  try{ if(store.get('forcePlayer',false)){ MEDIA_OK=true; return; } }catch(e){}
  try{
    const a=document.createElement('audio');
    a.preload='metadata'; a.muted=true;
    const done=v=>{ if(MEDIA_OK===null){ MEDIA_OK=v; if(GAMES[cur]||cur==='duel') go(cur); } };
    a.addEventListener('loadedmetadata',()=>done(true));
    a.addEventListener('canplay',()=>done(true));
    a.addEventListener('error',()=>done(false));
    a.src='https://p.scdn.co/mp3-preview/1bac6ffe2b3312b0a6fdb50a3f57c88b4a5562e6.mp3';
    a.load();
    setTimeout(()=>done(false),4000);
  }catch(e){ MEDIA_OK=false; }
})();
window.onYouTubeIframeAPIReady=function(){YTREADY=true;ytQueue.splice(0).forEach(f=>{try{f()}catch(e){}})};
(function(){ const t=document.createElement('script');
  t.src='https://www.youtube.com/iframe_api';
  t.onerror=()=>{apiFailed=true};
  document.head.appendChild(t);
  setTimeout(()=>{ if(!YTREADY){apiFailed=true;} }, 4500);
})();

let PL=null, curtainOn=true, plainMode=false;

function playerHTML(id){
  if(MEDIA_OK!==true) return linkOnlyHTML(id);
  return '<div class="pstage">'+
    '<div class="pmarquee"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>'+
    '<div class="pwrap" data-vid="'+id+'">'+
      '<div class="pframe" id="pframe"><div id="ytmount"></div></div>'+
      '<div class="pcurtain" id="pcurtain">'+
        '<div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>'+
        '<div class="plabel">Audio only &mdash; picture hidden</div>'+
        '<div class="phint">click anywhere on this panel to play or pause</div></div>'+
    '</div>'+
    '<div class="pctl">'+
      '<button class="btn play" id="pPlay">&#9654; Play</button>'+
      '<button class="btn ghost" id="pPause">Pause</button>'+
      '<button class="btn ghost" id="pBack">&#8634; Restart</button>'+
      '<button class="btn ghost" id="pFwd">Skip +10s</button>'+
      '<button class="btn alt" id="pShow">Show picture</button>'+
    '</div>'+
    '<div class="pctl" id="pOpenRow" style="display:none">'+
      '<a class="btn play" id="pOpen" href="'+yt(id)+'" target="_blank" rel="noopener" '+
        'style="text-decoration:none;font-size:.92rem;padding:15px 26px">&#9654; Open the clip &rsaquo;</a>'+
    '</div>'+
    '<div class="pstatus" id="pstatus">loading the player\u2026</div>'+
    '<a class="pfallback" href="'+yt(id)+'" target="_blank" rel="noopener">still nothing? open it on YouTube &rsaquo;</a>'+
  '</div>';
}
function linkOnlyHTML(id){
  return '<div class="pstage">'+
    '<div class="pmarquee"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>'+
    '<div class="linkbox">'+
      '<div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>'+
      '<a class="btn play" href="'+yt(id)+'" target="_blank" rel="noopener" '+
        'style="text-decoration:none;font-size:1rem;padding:17px 30px;margin-top:18px;display:inline-block">'+
        '&#9654; Play the clip</a>'+
      '<div class="phint" style="margin-top:14px">opens in a new tab \u2014 close it to come back</div>'+
      '<button class="chip" id="forcePlayer" style="margin-top:16px">try the built-in player anyway &rsaquo;</button>'+
    '</div></div>';
}
function setStatus(t,tone){ const el=document.getElementById('pstatus');
  if(el){ el.textContent=t; el.className='pstatus'+(tone?' '+tone:''); } }
function killCaptions(){
  if(!PL)return;
  ['captions','cc'].forEach(m=>{
    try{ PL.unloadModule(m); }catch(e){}
    try{ PL.setOption(m,'track',{}); }catch(e){}
  });
}
function lockFrame(locked){ const w=document.querySelector('.pwrap');
  if(w)w.classList.toggle('noclick',!!locked); }
function dropCurtain(){ const c=document.getElementById('pcurtain');
  if(c)c.classList.add('up'); curtainOn=false;
  lockFrame(true);               /* picture is showing: no stray YouTube chrome */
  const b=document.getElementById('pShow'); if(b)b.textContent='Hide picture'; }
function raiseCurtain(){ const c=document.getElementById('pcurtain');
  if(c)c.classList.remove('up'); curtainOn=true;
  lockFrame(false);              /* curtain back: clicks reach the player again */
  const b=document.getElementById('pShow'); if(b)b.textContent='Show picture'; }

function plainIframe(vid){
  if(plainMode)return;
  const f=document.getElementById('pframe'); if(!f)return;
  plainMode=true; PL=null;
  /* Try a plain embed anyway - it works when this page is opened as a local
     file or served normally. On pages that block third-party frames (the
     Claude artifact sandbox does) it renders as an empty box, so the
     Open-the-clip button is promoted at the same time rather than leaving
     the host staring at a grey square in front of a room. */
  f.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+vid+
    '?rel=0&modestbranding=1&iv_load_policy=3&cc_load_policy=0&playsinline=1&controls=1" '+
    'allow="autoplay; encrypted-media" referrerpolicy="origin" allowfullscreen></iframe>';
  const row=document.getElementById('pOpenRow'); if(row)row.style.display='';
  const curt=document.getElementById('pcurtain');
  if(curt){ const hint=curt.querySelector('.phint');
    if(hint)hint.textContent='if this panel stays blank, use Open the clip below'; }
  setStatus(IS_FILE
    ? 'Click the panel to play. Use the YouTube controls on it \u2014 the buttons above won\u2019t work in this mode.'
    : 'Video can\u2019t be embedded on this page \u2014 use Open the clip. '+
      'Run the downloaded file instead, or play the audio from Spotify.','bad');
}
function mountPlayer(vid,startHidden){
  try{ if(PL&&PL.destroy)PL.destroy(); }catch(e){}
  PL=null; plainMode=false; curtainOn=startHidden!==false;
  lockFrame(false);
  const make=()=>{
    if(!document.getElementById('ytmount'))return;
    if(IS_FILE||apiFailed||!window.YT||!window.YT.Player){ plainIframe(vid); return; }
    try{
      PL=new YT.Player('ytmount',{videoId:vid,host:'https://www.youtube-nocookie.com',
      playerVars:{controls:0,rel:0,modestbranding:1,iv_load_policy:3,disablekb:1,fs:0,
        playsinline:1,cc_load_policy:0,cc_lang_pref:'none'},
      events:{
        onReady:()=>{ killCaptions(); setStatus('Ready \u2014 press Play, or click the panel','good'); },
        onError:e=>{ setStatus('This clip wouldn\u2019t load (code '+e.data+'). Hit Skip.','bad'); },
        onStateChange:e=>{
          /* Auto-captions transcribe the lyrics and hand over the answer in text
             while the room is still guessing. They reload on state changes, so
             they get killed again every time. */
          killCaptions();
          if(e.data===YT.PlayerState.PLAYING) setStatus('Playing','good');
          if(e.data===YT.PlayerState.PAUSED)  setStatus('Paused','');
          if(e.data===YT.PlayerState.ENDED){ raiseCurtain(); setStatus('Clip finished','') }
        }}});
    }catch(e){ plainIframe(vid); }
  };
  if(IS_FILE){ make(); return; }
  if(YTREADY) make();
  else { ytQueue.push(make);
    setTimeout(()=>{ if(!PL && !document.querySelector('.pframe iframe')) plainIframe(vid); },5000); }
}
function wirePlayer(root,startHidden){
  const fp=root.querySelector('#forcePlayer');
  if(fp)fp.addEventListener('click',()=>{
    store.set('forcePlayer',true); MEDIA_OK=true; go(cur);
  });
  const w=root.querySelector('.pwrap'); if(!w)return;
  mountPlayer(w.dataset.vid,startHidden);
  const on=(id,fn)=>{const b=root.querySelector('#'+id); if(b)b.addEventListener('click',fn)};
  on('pPlay',()=>{
    if(plainMode){ setStatus('Simple mode \u2014 click the dark panel itself to start','bad'); return; }
    try{ PL&&PL.playVideo(); }catch(e){}
    /* If the browser refused, say so plainly and point at the thing that works. */
    setTimeout(()=>{ try{
      if(PL&&PL.getPlayerState&&PL.getPlayerState()!==1)
        setStatus('Browser blocked it \u2014 click the dark panel above to start','bad');
    }catch(e){} },1400);
  });
  on('pPause',()=>{try{PL&&PL.pauseVideo()}catch(e){}});
  on('pBack',()=>{try{PL.seekTo(0,true);PL.playVideo()}catch(e){}});
  on('pFwd',()=>{try{PL.seekTo(PL.getCurrentTime()+10,true)}catch(e){}});
  on('pShow',()=>{curtainOn?dropCurtain():raiseCurtain()});
  if(startHidden===false)dropCurtain();
}

<script>
/* =================== storage (safe) =================== */
const store={
  get(k,d){try{const v=localStorage.getItem('ssx_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('ssx_'+k,JSON.stringify(v))}catch(e){}}
};
let teams=store.get('teams',[{n:'TABLE 1',s:0},{n:'TABLE 2',s:0},{n:'TABLE 3',s:0},{n:'TABLE 4',s:0}]);
let played=store.get('played',{});
const saveTeams=()=>store.set('teams',teams);
const savePlayed=()=>store.set('played',played);

/* =================== helpers =================== */
const yt=id=>'https://www.youtube.com/watch?v='+id;
const decade=y=>y<1940?"1930s":y<1950?"1940s":y<1960?"1950s":y<1970?"1960s":"1970s";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* Draws from a pool, exhausting unplayed items first so a repeat
   session serves fresh content without any rebuilding. */
function makeDeck(gameKey,pool){
  const seen=new Set(played[gameKey]||[]);
  const fresh=shuffle(pool.map((_,i)=>i).filter(i=>!seen.has(i)));
  const old=shuffle(pool.map((_,i)=>i).filter(i=>seen.has(i)));
  return fresh.concat(old);
}
function markPlayed(gameKey,idx){
  played[gameKey]=played[gameKey]||[];
  if(!played[gameKey].includes(idx))played[gameKey].push(idx);
  savePlayed();
}

/* =================== game definitions =================== */
const GAMES={
  nameThat:{

      meta:"Tier "+c.tier+" &nbsp;·&nbsp; "+decade(c.y),
      q:"What movie<br>is this from?",
      small:"Play the clip, let it run 30–45 seconds, then pause and take answers.",

      aBig:esc(c.m)+" ("+c.y+")",

  title:{
    title:"Finish the Title", color:"c2", tabClass:"g2", mins:"5–7 min",
    blurb:"One word is missing. They shout it. Fastest game in the set.",
    rules:["1 point per correct word. No conferring — first voice wins.",
           "Great opener and great closer. Run it fast and keep it loud."],
    pool:()=>TITLES,
    render(t){return{
      meta:"Fill in the blank",
      q:esc(t[0]).replace(/___/g,'<span class="blank">______</span>'),
      small:t[2]?"Hint if they stall: "+esc(t[2]):"",
      aBig:esc(t[1]), aDet:t[2]?esc(t[2]):""
    }}
  },
  whoSang:{
    title:"Who Sang It?", color:"c3", tabClass:"", mins:"7–9 min",
    blurb:"Name the song and the film. Now name who performed it.",
    rules:["2 points for the performer. 1 point for a near miss (right film, wrong name).",
           "Play the clip afterward as the reveal — that's the payoff."],
    pool:()=>CLIPS.filter(c=>c.tier<=2),
    render(c){return{
      meta:"Who performed it?",
      q:"“"+esc(c.s)+"”",
      small:"from "+esc(c.m)+" ("+c.y+")",
      aBig:esc(c.p),
      aDet:"Play the clip to confirm it — and let them sing along.",
      clip:c.id
    }}
  },
  ballpark:{
    title:"Ballpark Years", color:"c4", tabClass:"g3", mins:"7–9 min",
    blurb:"Guess the year it came out. Closest table wins it — no need to be exact.",
    rules:["Every table writes a year. Closest wins 2 points. Dead on wins 4.",
           "Ties split the points. Nobody is ever out of this one."],
    pool:()=>{const seen=new Set();return CLIPS.filter(c=>{const k=c.m+c.y;if(seen.has(k))return false;seen.add(k);return true})},
    render(c){return{
      meta:"What year?",
      q:esc(c.m),
      small:"Every table commits to a year before you reveal. Closest one takes it.",
      aBig:String(c.y),
      aDet:"“"+esc(c.s)+"” &nbsp;·&nbsp; "+esc(c.p),
      clip:c.id
    }}
  },
  showdown:{
    title:"Showstopper Showdown", color:"c5", tabClass:"g4", mins:"6–8 min",
    blurb:"The closer. Everything mixed together, double points, no hints.",
    rules:["All points are doubled. Hands up, first hand answers.",
           "A wrong answer passes the question to the next table.",
           "Run it until someone's caught up or time's gone. Then crown the table."],
    pool:()=>{
      const a=CLIPS.filter(c=>c.tier===1).map(c=>({k:'c',d:c}));
      const b=TITLES.map(t=>({k:'t',d:t}));
      return a.concat(b);
    },
    render(x){
      if(x.k==='c'){const c=x.d;return{
        meta:"Double points &nbsp;·&nbsp; name the movie",
        q:"“"+esc(c.s)+"”",
        small:"Sung by "+esc(c.p)+". Which movie?",
        aBig:esc(c.m)+" ("+c.y+")", aDet:esc(c.p),
        clip:c.id
      }}
      const t=x.d;return{
        meta:"Double points &nbsp;·&nbsp; finish the title",
        q:esc(t[0]).replace(/___/g,'<span class="blank">______</span>'),
        small:"", aBig:esc(t[1]), aDet:t[2]?esc(t[2]):""
      }
    }
  }
};
const GKEYS=Object.keys(GAMES);
</script>

/* =================== lobby =================== */
const SOUNDTEST=[
 {n:"Make \u2019Em Laugh \u2014 Singin\u2019 in the Rain",u:"https://p.scdn.co/mp3-preview/1bac6ffe2b3312b0a6fdb50a3f57c88b4a5562e6.mp3"},
 {n:"Over the Rainbow \u2014 The Wizard of Oz",u:"https://p.scdn.co/mp3-preview/61c35aaa761af490ded7356501a463c185eed352.mp3"},
 {n:"Tonight \u2014 West Side Story",u:"https://p.scdn.co/mp3-preview/ef56097b9c70e5b49f1174a88c504081e8b9df00.mp3"},
 {n:"I Could Have Danced All Night \u2014 My Fair Lady",u:"https://p.scdn.co/mp3-preview/5738dea8e9746af69092ff85a3a5a9a220f0c7fc.mp3"}

let libFilter='all', libSearch='';

}

/* =================== game runner =================== */
let decks={}, pos={}, cur='lobby';
function gameHTML(key){
  const g=GAMES[key], poolArr=g.pool();
  if(!decks[key]){decks[key]=makeDeck(key,poolArr);pos[key]=0}
  const deck=decks[key];
  if(pos[key]>=deck.length){pos[key]=0;decks[key]=makeDeck(key,poolArr)}
  const idx=decks[key][pos[key]];
  const v=g.render(poolArr[idx]);
  const seenCount=(played[key]||[]).length;
  return '<div class="card tiltL" style="padding:21px 26px"><h2 class="ttl">'+esc(g.title)+'</h2>'+
    '<p class="lede" style="margin-top:7px">'+esc(g.blurb)+'</p>'+
    '<div class="rule"></div><ul style="margin-left:19px">'+
    g.rules.map(r=>'<li style="line-height:1.6;color:#E8DCC8;margin-bottom:5px">'+r+'</li>').join('')+

      '<div class="qmeta">'+v.meta+'</div>'+

      (v.clip?playerHTML(v.clip):'')+

        (v.aDet?'<div class="det">'+v.aDet+'</div>':'')+
      '</div>'+
      '<div class="controls">'+
        '<button class="btn" id="revealBtn">Reveal answer</button>'+
        '<button class="btn alt" id="nextBtn">Next &rsaquo;</button>'+
        '<button class="btn ghost" id="skipBtn">Skip</button>'+
      '</div>'+
      '<div class="progress">Question '+(pos[key]+1)+' of '+deck.length+
        ' in this round &nbsp;&middot;&nbsp; '+seenCount+' of '+poolArr.length+' used across all sessions</div>'+
    '</div>'+ boardHTML();
}
function wireGame(root,key){
  wirePlayer(root,true);
  const ans=root.querySelector('#ans');
  const rev=root.querySelector('#revealBtn');
  // Reveal updates the DOM in place rather than re-rendering, so the clip
  // keeps playing straight through the reveal instead of restarting.
  if(rev)rev.addEventListener('click',()=>{
    ans.classList.add('show'); dropCurtain();
    rev.textContent='Answer shown'; rev.disabled=true; rev.style.opacity=.55;
  });
  const nx=root.querySelector('#nextBtn');
  if(nx)nx.addEventListener('click',()=>{markPlayed(key,decks[key][pos[key]]);pos[key]++;go(key)});
  const sk=root.querySelector('#skipBtn');
  if(sk)sk.addEventListener('click',()=>{pos[key]++;go(key)});
}

<script>
/* =================== HEAD-TO-HEAD (1:1) =================== */
let duel=store.get('duel',null);
function newDuel(n1,n2,target){
  const pool=[].concat(
    CLIPS.filter(c=>c.tier<=2).map(c=>({k:'clip',d:c})),
    TITLES.map(t=>({k:'title',d:t})),
    CLIPS.filter(c=>c.tier<=2).map(c=>({k:'year',d:c}))
  );
  duel={p:[{n:n1||'PLAYER 1',s:0},{n:n2||'PLAYER 2',s:0}],turn:0,target:target||10,
        deck:shuffle(pool.map((_,i)=>i)),pos:0,phase:'ask',winner:null,
        pool:pool.map(x=>x.k==='title'?{k:x.k,d:x.d}:{k:x.k,d:x.d}),log:[]};
  store.set('duel',duel);
}
function duelQ(){
  const x=duel.pool[duel.deck[duel.pos%duel.deck.length]];
  if(x.k==='clip')return{
    tagline:'Name the movie',
    q:'“'+esc(x.d.s)+'”',
    small:'Sung by '+esc(x.d.p),
    a:esc(x.d.m)+' ('+x.d.y+')',
    det:'“'+esc(x.d.s)+'” · '+esc(x.d.p),
    clip:x.d.id, worth:2};
  if(x.k==='year')return{
    tagline:'Name the year — within two counts',
    q:esc(x.d.m),
    small:'Closest guess inside two years takes it.',
    a:String(x.d.y),
    det:esc(x.d.m)+' · “'+esc(x.d.s)+'”',
    clip:x.d.id, worth:2};
  const t=x.d;return{
    tagline:'Finish the title',
    q:esc(t[0]).replace(/___/g,'<span class="blank">______</span>'),
    small:t[2]?'':'',
    a:esc(t[1]), det:t[2]?esc(t[2]):'', worth:1};
}
function duelHTML(){
  if(!duel) return `<div class="card tiltL"><h2 class="ttl">Head&#8209;to&#8209;Head</h2>
    <div class="rule"></div>
    <p class="lede">One against one. Players alternate turns \u2014 miss your question and your opponent
    can steal it for half. First to the target wins. Takes about five minutes, which makes it
    the right way to test-drive the whole module with one other person.</p>
    <div style="margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px">
      <div class="team"><label style="font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)">Player 1</label>
        <input id="d1" placeholder="Name" value="A.J." aria-label="Player 1 name"></div>
      <div class="team"><label style="font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)">Player 2</label>
        <input id="d2" placeholder="Name" value="" aria-label="Player 2 name"></div>
      <div class="team"><label style="font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)">Play to</label>
        <input id="dt" value="10" aria-label="Target score"></div>
    </div>
    <div class="controls" style="margin-top:20px"><button class="btn" id="startDuel">Start the duel</button></div>
    <div class="note" style="margin-top:18px"><strong>How a turn works:</strong> the clip plays with the
    picture hidden. The player whose turn it is answers out loud, you hit Reveal, then mark it.
    A miss opens a steal for the other player at half points. Either way the turn passes.</div></div>`;

  const [a,b]=duel.p, q=duelQ(), hot=duel.turn, cold=1-duel.turn;
  if(duel.winner!==null){
    const w=duel.p[duel.winner];
    return `<div class="stage" style="border:4px solid var(--gold)">
      <div class="qmeta">We have a winner</div>
      <div class="qbig" style="color:var(--gold)">${esc(w.n)}<br>takes it</div>
      <div class="qsmall" style="font-size:1.5rem;font-weight:900;margin-top:20px">
        ${esc(a.n)} ${a.s} &nbsp;&mdash;&nbsp; ${b.s} ${esc(b.n)}</div>
      <div class="controls"><button class="btn" id="rematch">Rematch</button>
      <button class="btn ghost" id="endDuel">New players</button></div></div>`;
  }
  const steal=Math.max(1,Math.round(q.worth/2));
  return `<div class="card tiltL" style="padding:19px 24px">
    <h2 class="ttl" style="font-size:1.5rem">Head&#8209;to&#8209;Head</h2>
    <p class="lede" style="margin-top:5px;font-size:.93rem">First to ${duel.target}. A miss can be stolen for half.</p></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:17px">
    ${duel.p.map((pl,i)=>`<div class="team" style="${i===hot?'outline:4px solid var(--gold);background:var(--ink3)':''}">
      <div style="font-weight:900;text-transform:uppercase;letter-spacing:.05em;font-size:.9rem">${esc(pl.n)}</div>
      <div class="score">${pl.s}</div>
      <div style="font-size:.68rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:${i===hot?'var(--gold)':'#6B5B85'}">
        ${i===hot?'&#9654; Their turn':'waiting'}</div></div>`).join('')}
  </div>
  <div class="stage">
    <div class="qmeta">${esc(duel.p[hot].n)} &nbsp;&middot;&nbsp; ${q.tagline} &nbsp;&middot;&nbsp; ${q.worth} pt${q.worth>1?'s':''}</div>
    <div class="qbig">${q.q}</div>
    ${q.small?`<div class="qsmall">${q.small}</div>`:''}
    ${q.clip?playerHTML(q.clip):''}
    <div class="answer${duel.phase!=='ask'?' show':''}" id="ans">
      <div class="big">${q.a}</div>${q.det?`<div class="det">${q.det}</div>`:''}</div>
    <div class="controls" id="cAsk" style="${duel.phase!=='ask'?'display:none':''}">
      <button class="btn" id="revealBtn">Reveal answer</button></div>
    <div class="controls" id="cRev" style="${duel.phase!=='revealed'?'display:none':''}">
      <button class="btn alt" id="gotIt">${esc(duel.p[hot].n)} got it &nbsp;+${q.worth}</button>
      <button class="btn ghost" id="missed">Missed \u2014 open the steal</button></div>
    <div class="controls" id="cSteal" style="${duel.phase!=='steal'?'display:none':''}">
      <button class="btn play" id="stole">${esc(duel.p[cold].n)} stole it &nbsp;+${steal}</button>
      <button class="btn ghost" id="noSteal">Nobody got it</button></div>
    <div class="progress" id="stealBanner" style="color:var(--mag);font-weight:900;${duel.phase!=='steal'?'display:none':''}">
      STEAL IS OPEN &mdash; ${esc(duel.p[cold].n)} can take it for half</div>
    <div class="progress">Question ${duel.pos+1} &nbsp;&middot;&nbsp; playing to ${duel.target}</div>
  </div>
  <div class="controls" style="margin-top:15px"><button class="btn ghost" id="endDuel">End duel / new players</button></div>`;
}
function duelAdvance(){
  duel.pos++; duel.turn=1-duel.turn; duel.phase='ask';
  // Someone wins only by reaching the target AND being strictly ahead.
  // Level at the target means sudden death — play on until one pulls clear.
  const [x,y]=duel.p.map(p=>p.s);
  if((x>=duel.target||y>=duel.target) && x!==y) duel.winner = x>y?0:1;
  store.set('duel',duel); go('duel');
}
function wireDuel(root){
  if(duel && duel.winner===null && duelQ().clip) wirePlayer(root,true);
  const show=(id,on)=>{const el=root.querySelector('#'+id); if(el)el.style.display=on?'':'none'};
  const sd=root.querySelector('#startDuel');
  if(sd)sd.addEventListener('click',()=>{
    newDuel(root.querySelector('#d1').value.trim(),root.querySelector('#d2').value.trim(),
      Math.max(2,parseInt(root.querySelector('#dt').value,10)||10));
    go('duel');
  });
  const ed=root.querySelector('#endDuel');
  if(ed)ed.addEventListener('click',()=>{duel=null;store.set('duel',null);go('duel')});
  const rm=root.querySelector('#rematch');
  if(rm)rm.addEventListener('click',()=>{newDuel(duel.p[0].n,duel.p[1].n,duel.target);go('duel')});
  // reveal + steal change the DOM in place; the clip plays straight through
  const rv=root.querySelector('#revealBtn');
  if(rv)rv.addEventListener('click',()=>{
    duel.phase='revealed'; store.set('duel',duel);
    root.querySelector('#ans').classList.add('show'); dropCurtain();
    show('cAsk',false); show('cRev',true);
  });
  const ms=root.querySelector('#missed');
  if(ms)ms.addEventListener('click',()=>{
    duel.phase='steal'; store.set('duel',duel);
    show('cRev',false); show('cSteal',true); show('stealBanner',true);
  });
  const gi=root.querySelector('#gotIt');
  if(gi)gi.addEventListener('click',()=>{duel.p[duel.turn].s+=duelQ().worth;duelAdvance()});
  const st=root.querySelector('#stole');
  if(st)st.addEventListener('click',()=>{duel.p[1-duel.turn].s+=Math.max(1,Math.round(duelQ().worth/2));duelAdvance()});
  const ns=root.querySelector('#noSteal');
  if(ns)ns.addEventListener('click',()=>duelAdvance());
}
</script>

<script>
/* =================== MUSIC ROUND (Spotify-driven) =================== */
/* Browsers on this page can't play media, so the sound comes from Spotify
   on a phone or laptop. The setlist keeps both sides in lockstep: you build
   it before the session, queue the same songs in Spotify, then advance the
   module and the queue together. */
let setlist = store.get('setlist', []);
let srPos   = store.get('srPos', 0);
let srMode  = 'build';
const saveSet=()=>store.set('setlist',setlist);
const spotifySearch=c=>'https://open.spotify.com/search/'+encodeURIComponent(c.s+' '+c.m);

function musicHTML(){
  if(srMode==='play' && setlist.length) return musicPlayHTML();
  return musicBuildHTML();
}
function musicBuildHTML(){
  const chosen=setlist.map(i=>CLIPS[i]).filter(Boolean);
  const q=(window.__srSearch||'').toLowerCase();
  const pool=CLIPS.map((c,i)=>({c,i}))
    .filter(({c,i})=>!setlist.includes(i) && (!q||(c.s+' '+c.m+' '+c.p).toLowerCase().includes(q)));
  return '<div class="card tiltL"><h2 class="ttl">Music Round</h2><div class="rule"></div>'+
    '<p class="lede">The sound comes from Spotify, not from this page. Build your setlist here '+
    '<strong>before the session</strong>, queue the same songs in Spotify, then run the round — '+
    'the module and your queue step forward together.</p>'+
    '<div class="note" style="margin-top:14px"><strong>Why this is the spoiler-free way:</strong> '+
    'audio has no title card, no thumbnail and no captions. Keep Spotify on your phone into the room '+
    'speaker and the screen never gives anything away.</div></div>'+

    '<div class="card"><h3 class="sub">Your setlist — '+chosen.length+' song'+(chosen.length===1?'':'s')+'</h3>'+
    (chosen.length
      ? '<ol style="margin-left:20px">'+chosen.map((c,n)=>
          '<li style="line-height:1.6;color:#E8DCC8;margin-bottom:7px">'+
          '<strong style="color:var(--gold)">'+esc(c.s)+'</strong> — '+esc(c.m)+' ('+c.y+') '+
          '<button class="chip" data-rm="'+n+'" style="margin-left:7px;padding:4px 10px">remove</button></li>').join('')+'</ol>'+
        '<div class="controls" style="justify-content:flex-start;margin-top:16px">'+
          '<button class="btn" id="srStart">Start the round</button>'+
          '<button class="btn alt" id="srQueue">Show the Spotify queue list</button>'+
          '<button class="btn ghost" id="srClear">Clear setlist</button></div>'
      : '<p class="lede">Nothing picked yet. Tap the button for a ready-made round, or add songs below — eight to twelve is about right.</p>'+
        '<div class="controls" style="justify-content:flex-start;margin-top:14px">'+
        '<button class="btn" id="srFill">Fill with 10 crowd-pleasers</button></div>')+
    '</div>'+

    '<div class="card"><h3 class="sub">Add songs</h3>'+
    '<div class="filters"><input id="srSearch" placeholder="Search the library…" value="'+esc(window.__srSearch||'')+'"></div>'+
    '<div class="cliplist" id="srPool">'+
      pool.slice(0,40).map(({c,i})=>'<div class="clip"><span class="dec">'+decade(c.y)+'</span>'+
        '<div class="song">'+esc(c.s)+'</div>'+
        '<div class="mv">'+esc(c.m)+' &nbsp;·&nbsp; '+c.y+'</div>'+
        '<button class="btn alt" data-add="'+i+'" style="margin-top:10px;padding:9px 15px;font-size:.74rem">+ Add to setlist</button>'+
      '</div>').join('')+
    '</div></div>';
}
function musicPlayHTML(){
  const n=setlist.length;
  if(srPos>=n) return '<div class="stage" style="border:4px solid var(--gold)">'+
    '<div class="qmeta">Round complete</div>'+
    '<div class="qbig" style="color:var(--gold)">That’s the<br>music round</div>'+
    '<div class="controls"><button class="btn" id="srAgain">Run it again</button>'+
    '<button class="btn ghost" id="srEdit">Back to the setlist</button></div></div>';
  const c=CLIPS[setlist[srPos]];
  return '<div class="card tiltL" style="padding:19px 24px">'+
    '<h2 class="ttl" style="font-size:1.5rem">Music Round</h2>'+
    '<p class="lede" style="margin-top:5px;font-size:.93rem">Play song '+(srPos+1)+' in your Spotify queue, '+
    'let it run, then take answers.</p></div>'+
    '<div class="stage">'+
      '<div class="qmeta">Song '+(srPos+1)+' of '+n+'</div>'+
      '<div class="qbig">What movie<br>is this from?</div>'+
      '<div class="qsmall">The answer stays hidden until you reveal it — nothing on this screen gives it away.</div>'+
      '<div class="answer" id="ans"><div class="big">'+esc(c.m)+' ('+c.y+')</div>'+
        '<div class="det">“'+esc(c.s)+'” &nbsp;·&nbsp; '+esc(c.p)+'</div>'+
        '<div class="controls" style="margin-top:13px">'+
          '<a class="btn ghost" href="'+yt(c.id)+'" target="_blank" rel="noopener" '+
          'style="text-decoration:none;font-size:.76rem">watch the number on YouTube</a></div>'+
      '</div>'+
      '<div class="controls">'+
        '<button class="btn" id="srReveal">Reveal answer</button>'+
        '<button class="btn alt" id="srNext">Next song &rsaquo;</button>'+
        '<button class="btn ghost" id="srEdit">Edit setlist</button>'+
      '</div>'+
    '</div>'+boardHTML();
}
function queueListHTML(){
  return '<div class="card"><h2 class="ttl">Spotify queue list</h2><div class="rule"></div>'+
  '<p class="lede">Queue these in Spotify in this order before the session, then the module’s '+
  '“Song 1, 2, 3…” matches your queue exactly. Each title links to it in Spotify.</p>'+
  '<ol style="margin-left:20px;margin-top:14px">'+
  setlist.map(i=>CLIPS[i]).filter(Boolean).map(c=>
    '<li style="line-height:1.7;color:#E8DCC8;margin-bottom:9px">'+
    '<a href="'+spotifySearch(c)+'" target="_blank" rel="noopener" '+
    'style="color:var(--teal);font-weight:900;text-decoration:none">'+esc(c.s)+'</a> — '+
    esc(c.p)+' &nbsp;·&nbsp; <span style="color:#9C8BB8">'+esc(c.m)+' ('+c.y+')</span></li>').join('')+
  '</ol><div class="controls" style="justify-content:flex-start;margin-top:16px">'+
  '<button class="btn" id="srBack">Back</button>'+
  '<button class="btn ghost" onclick="window.print()">Print this list</button></div></div>';
}
function wireMusic(root){
  const re=()=>go('music');
  root.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',e=>{
    setlist.push(+e.currentTarget.dataset.add); saveSet(); re(); }));
  root.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',e=>{
    setlist.splice(+e.currentTarget.dataset.rm,1); saveSet(); re(); }));
  const s=root.querySelector('#srSearch');
  if(s)s.addEventListener('input',e=>{window.__srSearch=e.target.value;
    const p=document.getElementById('srPool');
    if(p){const q=e.target.value.toLowerCase();
      p.innerHTML=CLIPS.map((c,i)=>({c,i})).filter(({c,i})=>!setlist.includes(i)&&
        (!q||(c.s+' '+c.m+' '+c.p).toLowerCase().includes(q))).slice(0,40)
        .map(({c,i})=>'<div class="clip"><span class="dec">'+decade(c.y)+'</span>'+
          '<div class="song">'+esc(c.s)+'</div><div class="mv">'+esc(c.m)+' &nbsp;·&nbsp; '+c.y+'</div>'+
          '<button class="btn alt" data-add="'+i+'" style="margin-top:10px;padding:9px 15px;font-size:.74rem">+ Add to setlist</button></div>').join('');
      p.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',ev=>{
        setlist.push(+ev.currentTarget.dataset.add); saveSet(); re(); }));
    }});
  const on=(id,fn)=>{const b=root.querySelector('#'+id); if(b)b.addEventListener('click',fn)};
  on('srFill',()=>{
    const want=["Over the Rainbow","Singin' in the Rain","Do-Re-Mi","Oh, What a Beautiful Mornin'",
      "Supercalifragilisticexpialidocious","If I Were a Rich Man","Jailhouse Rock","Hello, Dolly!",
      "Seventy-Six Trombones","Summer Nights"];
    setlist=want.map(s=>CLIPS.findIndex(c=>c.s===s)).filter(i=>i>=0);
    saveSet(); re();
  });
  on('srStart',()=>{srMode='play';srPos=0;store.set('srPos',0);re()});
  on('srClear',()=>{setlist=[];saveSet();srPos=0;store.set('srPos',0);re()});
  on('srEdit',()=>{srMode='build';re()});
  on('srAgain',()=>{srPos=0;store.set('srPos',0);re()});
  on('srNext',()=>{srPos++;store.set('srPos',srPos);re()});
  on('srReveal',()=>{const a=root.querySelector('#ans'); if(a)a.classList.add('show');
    const b=root.querySelector('#srReveal'); if(b){b.textContent='Answer shown';b.disabled=true;b.style.opacity=.55}});
  on('srQueue',()=>{srMode='queue';re()});
  on('srBack',()=>{srMode='build';re()});
}
</script>

<script>
/* =================== host booth =================== */
function boothHTML(){
  return '<div class="card booth"><h2 class="ttl">Host Booth</h2>'+
  '<div class="rule"></div>'+
  '<p class="lede">Everything you need to run this cold. If you only read one thing, read the six rules.</p>'+

  '<h4>The six rules of running this room</h4><ol>'+
  '<li><strong>Teams, not individuals.</strong> Tables compete. Nobody sits exposed, and the quiet ones still get carried along by their table.</li>'+
  '<li><strong>Never correct a wrong answer flatly.</strong> \u201CThat\u2019s the right era \u2014 anyone want to go a year or two either side?\u201D keeps them in it.</li>'+
  '<li><strong>Let the clip run longer than you think.</strong> Recognition often lands eight or ten seconds in. Resist cutting it early.</li>'+
  '<li><strong>Points are yours to award.</strong> If a table earns something the rules don\u2019t cover, give it. The scoreboard is a prop, not a referee.</li>'+
  '<li><strong>If they start singing, stop the game.</strong> Let the clip play out and let them sing. That\u2019s the actual program \u2014 the game is the excuse.</li>'+
  '<li><strong>End on a clip, not a score.</strong> Crown the table, then play one last number and walk out on it.</li>'+
  '</ol>'+

  '<h4>Before you start</h4><ul>'+
  '<li>Clips play inside this page \u2014 you never open a tab or leave the portal.</li>'+
  '<li>Test your sound on one clip before residents are in the room. Volume higher than feels right to you.</li>'+
  '<li>Click Play once yourself before the room fills \u2014 browsers block audio until the page has been clicked.</li>'+
  '<li>Name the tables on the scoreboard as they settle in. Let them pick their own names if they want it.</li>'+
  '<li>Have water. You\u2019ll talk more than you expect.</li>'+
  '</ul>'+

  '<h4>The player</h4>'+'<p class="lede" style="margin-bottom:11px">Clips play in the page. While they\u2019re guessing the picture sits behind a curtain and only the sound plays \u2014 a YouTube player otherwise gives the answer away through the thumbnail, the title bar, the channel watermark and the auto-captions. Reveal drops the curtain without restarting the clip, and the curtain comes back up at the end so no suggested videos appear.</p>'+'<ul><li><strong>Play / Pause / Restart</strong> \u2014 the basics.</li>'+'<li><strong>Skip +10s</strong> \u2014 jump a studio logo or a slow intro.</li>'+'<li><strong>Show picture</strong> \u2014 drop the curtain early when a table is close.</li></ul>'+'<h4>If something goes wrong</h4><ul>'+
  '<li><strong>A clip won\u2019t load.</strong> Hit Skip and move on \u2014 don\u2019t troubleshoot in front of the room. There\u2019s an \u201copen it on YouTube\u201d link under every player as a last resort.</li>'+
  '<li><strong>No sound.</strong> Click anywhere on the page once, then press Play again. That\u2019s nearly always it.</li>'+
  '<li><strong>Room\u2019s too quiet.</strong> Switch to Finish the Title. It\u2019s the easiest buy-in in the set.</li>'+
  '<li><strong>Room\u2019s too loud and rowdy.</strong> Go to Ballpark Years \u2014 writing a year down settles people.</li>'+
  '<li><strong>One table is running away with it.</strong> Go to the Showdown early. Double points erases any lead.</li>'+
  '<li><strong>You\u2019re running long.</strong> Cut a game, not the ending. The crowning matters more than the questions.</li>'+
  '</ul>'+

  '<h4>Intermission cards</h4>'+
  '<p class="lede" style="margin-bottom:11px">Read one between rounds. They buy you a breather and they\u2019re genuinely interesting \u2014 these are sourced facts, not folklore.</p>'+
  FACTS.map((f,i)=>'<div class="fact"><strong>'+(i+1)+'.</strong> '+f+'</div>').join('')+

  '<h4>Answer key \u2014 full clip library</h4>'+
  '<table class="runsheet"><tr><th>Song</th><th>Movie</th><th>Year</th><th>Performed by</th></tr>'+
  CLIPS.map(c=>'<tr><td>'+esc(c.s)+'</td><td>'+esc(c.m)+'</td><td>'+c.y+'</td><td>'+esc(c.p)+'</td></tr>').join('')+
  '</table>'+

  '<h4>Answer key \u2014 Finish the Title</h4>'+
  '<table class="runsheet"><tr><th>Prompt</th><th>Answer</th></tr>'+
  TITLES.map(t=>'<tr><td>'+esc(t[0])+'</td><td>'+esc(t[1])+'</td></tr>').join('')+
  '</table>'+

  '<div class="note" style="margin-top:20px"><strong>A note on the sing-along.</strong> '+
  'There are no printed lyric sheets in this module, by design \u2014 song lyrics are copyrighted and '+
  'reprinting fifty of them isn\u2019t something to put in a binder. It works better this way anyway: '+
  'the singing happens with the clip playing, with the original voice carrying the room. '+
  'Finish the Title gives you the shout-it-out energy without needing a word of lyric on paper.</div>'+

  '<div class="controls" style="margin-top:22px;justify-content:flex-start">'+
  '<button class="btn" onclick="window.print()">Print the guide book</button></div></div>';
}

/* =================== tabs & routing =================== */
const TABS=[{k:'lobby',label:'Marquee',cls:''}]
  .concat(GKEYS.map(k=>({k:k,label:GAMES[k].title,cls:GAMES[k].tabClass})))
  .concat([{k:'music',label:'Music Round',cls:'g1'},{k:'duel',label:'Head-to-Head',cls:''},{k:'library',label:'The Library',cls:'g2'},{k:'booth',label:'Host Booth',cls:'g3'}]);

function renderAll(){
  document.getElementById('tabs').innerHTML=TABS.map(t=>
    '<button class="tab '+(t.k===cur?'on '+t.cls:'')+'" data-tab="'+t.k+'">'+esc(t.label)+'</button>').join('');
  document.getElementById('tabs').querySelectorAll('.tab').forEach(b=>
    b.addEventListener('click',e=>go(e.target.dataset.tab)));
}
function go(key){
  cur=key;
  const p=document.getElementById('panels');
  let html;
  if(key==='lobby')html=lobbyHTML();
  else if(key==='library')html=libraryHTML();
  else if(key==='booth')html=boothHTML();
  else if(key==='duel')html=duelHTML();
  else if(key==='music')html=(srMode==='queue'?queueListHTML():musicHTML());
  else html=gameHTML(key);
  p.innerHTML='<div class="panel on">'+html+'</div>';
  renderAll();
  if(key!=='duel'&&key!=='music')wireBoard(p);
  if(key==='lobby')p.querySelectorAll('[data-goto]').forEach(b=>
    b.addEventListener('click',e=>go(e.currentTarget.dataset.goto)));
  if(key==='library')wireLibrary(p);
  if(key==='duel')wireDuel(p);
  if(key==='music'){wireMusic(p); if(srMode==='play')wireBoard(p);}
  if(GAMES[key])wireGame(p,key);
  window.scrollTo({top:0,behavior:'smooth'});
}
go('lobby');
</script>
